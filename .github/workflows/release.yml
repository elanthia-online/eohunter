name: release

# A tag like v0.5.1 builds the eohunter gem and attaches it to a GitHub
# release of the same name. Players install the gem from the release file; it is not
# pushed to rubygems.org.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rake gem
      - name: Check the tag matches the engine version
        run: |
          version=$(ruby -e "puts File.read('scripts/eohunter/engine.rb')[/VERSION = '([^']+)'/, 1]")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but engine VERSION is $version"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/eohunter-*.gem
          generate_release_notes: true

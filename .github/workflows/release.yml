name: release

# A tag like v0.5.1 builds the single-file eohunter.lic and the eohunter
# gem and attaches them (with the line maps) to a GitHub release of the
# same name. The gem is pushed to rubygems.org only when the repository
# variable RUBYGEMS_PUSH is "true" and the secret RUBYGEMS_API_KEY holds
# an Elanthia Online push key; until then the push step is skipped.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec
      - run: bundle exec rake build
      - run: ruby -c dist/eohunter.lic
      - run: ruby -c dist/libeocoordination.lic
      - run: bundle exec rake gem
      - name: Check the tag matches the engine version
        run: |
          version=$(ruby -e "puts File.read('scripts/eohunter/engine.rb')[/VERSION = '([^']+)'/, 1]")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but engine VERSION is $version"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/eohunter.lic
            dist/eohunter.lic.map
            dist/libeocoordination.lic
            dist/libeocoordination.lic.map
            dist/eohunter-*.gem
          generate_release_notes: true
      - name: Push the gem to rubygems.org
        if: ${{ vars.RUBYGEMS_PUSH == 'true' }}
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push dist/eohunter-*.gem
